# How to install:
# conda env create -f environments/environment_cpu.yml

name: googlehydrology
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.12.*
  - pytorch=2.5.*
  - cpuonly
  - torchaudio=2.5.*
  - torchvision=0.20.*
  - absl-py>=2.0
  - aiohttp
  - bokeh>=3.0
  - cachey
  - cfgrib
  - dask
  - distributed
  - eccodes
  - fsspec
  - gcsfs
  - geopandas>=1.0
  - gh
  - google-cloud-storage
  - h5netcdf
  - h5py
  - icechunk
  - ipython
  - jupyter
  - matplotlib>=3.8
  - more-itertools
  - nbsphinx
  - netcdf4
  - numpy>=2.0
  - pandas>=2.0
  - parso
  - psutil
  - pydantic>=2.0
  - pyproj
  - pytest
  - pytest-cov
  - pytest-timeout
  - pytest-xdist
  - python-eccodes
  - pyyaml
  - requests
  - ruamel.yaml
  - ruff
  - scipy
  - seaborn
  - shapely
  - sphinx>=8.0
  - sphinx-rtd-theme>=3.0
  - tensorboard
  - tqdm
  - xarray
  - zarr>=3.1
